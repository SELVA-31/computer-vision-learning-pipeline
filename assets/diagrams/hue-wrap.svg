<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="OpenCV hue scale showing red split across both ends of the 0 to 179 range, requiring two threshold windows">
  <rect x="0" y="0" width="900" height="330" rx="8" fill="#f6f8fa"/>

  <text x="35" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#24292f">Why red needs two hue windows</text>
  <text x="35" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a">OpenCV packs the 360° hue circle into 0–179 for uint8. Red sits at 0°, so cutting the circle open splits red across both ends.</text>

  <!-- Hue bar: 0..179 mapped to x 60..840 -->
  <defs>
    <linearGradient id="hue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.000" stop-color="#ff0000"/>
      <stop offset="0.167" stop-color="#ffff00"/>
      <stop offset="0.333" stop-color="#00ff00"/>
      <stop offset="0.500" stop-color="#00ffff"/>
      <stop offset="0.667" stop-color="#0000ff"/>
      <stop offset="0.833" stop-color="#ff00ff"/>
      <stop offset="1.000" stop-color="#ff0000"/>
    </linearGradient>
  </defs>
  <rect x="60" y="92" width="780" height="46" rx="3" fill="url(#hue)" stroke="#8c959f" stroke-width="1"/>

  <!-- Axis ticks every 30 hue units: x = 60 + h*(780/179) -->
  <g stroke="#57606a" stroke-width="1">
    <path d="M60 138 L 60 146"/>
    <path d="M191 138 L 191 146"/>
    <path d="M321 138 L 321 146"/>
    <path d="M452 138 L 452 146"/>
    <path d="M583 138 L 583 146"/>
    <path d="M713 138 L 713 146"/>
    <path d="M840 138 L 840 146"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">
    <text x="60" y="160">0</text>
    <text x="191" y="160">30</text>
    <text x="321" y="160">60</text>
    <text x="452" y="160">90</text>
    <text x="583" y="160">120</text>
    <text x="713" y="160">150</text>
    <text x="840" y="160">179</text>
  </g>
  <text x="450" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6e7781" text-anchor="middle">OpenCV hue value</text>

  <!-- Band 1: H 0-10  -> x 60 to 103.6 -->
  <rect x="60" y="86" width="44" height="58" fill="none" stroke="#24292f" stroke-width="2.5"/>
  <path d="M82 86 L 82 70" stroke="#24292f" stroke-width="1.5"/>
  <text x="82" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#24292f" text-anchor="middle">0–10</text>

  <!-- Band 2: H 170-179 -> x 800.8 to 840 -->
  <rect x="800" y="86" width="40" height="58" fill="none" stroke="#24292f" stroke-width="2.5"/>
  <path d="M820 86 L 820 70" stroke="#24292f" stroke-width="1.5"/>
  <text x="820" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#24292f" text-anchor="middle">170–179</text>

  <!-- Tie the two ends together -->
  <path d="M82 200 L 82 214 L 820 214 L 820 200" stroke="#0969da" stroke-width="1.75" fill="none"/>
  <rect x="356" y="204" width="188" height="21" rx="4" fill="#f6f8fa"/>
  <text x="450" y="219" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0969da" text-anchor="middle">bitwise_or — one red mask</text>

  <text x="35" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a">A single window such as</text>
  <text x="196" y="256" font-family="Consolas, Menlo, monospace" font-size="12" fill="#24292f">inRange(hsv, [0,s,v], [10,s,v])</text>
  <text x="404" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a">catches only the left half and silently drops everything above 170.</text>

  <text x="35" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606a">Every other colour is contiguous, so only red needs this. Green sits near 40–85 and blue near 90–130 — one window each.</text>

  <text x="35" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">Band width matters as much as position: exposure and white-balance drift move a colour's <tspan font-style="italic">measured</tspan> hue between frames, so a band</text>
  <text x="35" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606a">fitted tightly around a single sample will drop frames that are still the same physical colour.</text>
</svg>
