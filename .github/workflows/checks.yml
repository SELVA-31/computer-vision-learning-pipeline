name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # opencv-python links against GUI libraries that a headless runner does not
      # ship. The modules genuinely need the GUI build for cv2.imshow, so the
      # library is installed here rather than swapping requirements.txt for the
      # headless package, which would misrepresent what the code needs.
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exercise the processing functions (no camera required)
        run: python tools/verify_modules.py

      - name: Audit the documentation against the code
        run: python tools/check_repo.py

      - name: Reproduce the HSV measurement from the committed frame
        run: python tools/sample_hsv.py
